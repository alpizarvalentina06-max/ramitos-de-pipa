<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administración — Ramitos de Pipa</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #4a3040;
    }


    header {
      background: #f7c9dc;
      padding: 25px;
      text-align: center;
    }


    header h1 {
      margin: 0;
      font-size: 28px;
    }


    header p {
      margin: 8px 0 0;
    }


    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }


    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }


    .top-bar h2 {
      margin: 0;
    }


    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }


    .add-button {
      background: #d98caf;
      color: white;
    }


    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }


    .category-button {
      background: white;
      border: 1px solid #e6b6cc;
      color: #6b4055;
    }


    .category-button.active {
      background: #d98caf;
      color: white;
    }


    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }


    .product-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow:
        0 5px 20px rgba(100, 50, 80, 0.08);
    }


    .product-image {
      width: 100%;
      height: 180px;
      background: #f5e5ed;
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 50px;
      margin-bottom: 15px;
      overflow: hidden;
    }


    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .product-card h3 {
      margin: 5px 0;
    }


    .product-card p {
      margin: 7px 0;
    }


    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin: 8px 0;
    }


    .available {
      background: #e5f5e8;
      color: #397345;
    }


    .unavailable {
      background: #f5dddd;
      color: #9b4141;
    }


    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }


    .edit {
      background: #ead4f5;
    }


    .hide {
      background: #eee;
    }


    .delete {
      background: #f3c4c4;
    }


    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 18px;
    }


    /* =========================
       MODAL
    ========================= */


    .modal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.45);

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 1000;
    }


    .modal.show {
      display: flex;
    }


    .modal-content {
      width: 100%;
      max-width: 500px;

      background: white;

      border-radius: 20px;

      padding: 25px;

      max-height: 90vh;

      overflow-y: auto;
    }


    .modal-content h2 {
      margin-top: 0;
    }


    .form-group {
      margin-bottom: 16px;
    }


    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }


    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;

      padding: 12px;

      border: 1px solid #dfbfd0;

      border-radius: 10px;

      font-size: 15px;
    }


    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }


    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }


    .save-button {
      background: #d98caf;
      color: white;
      flex: 1;
    }


    .cancel-button {
      background: #eee;
      flex: 1;
    }


    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }


      .top-bar {
        align-items: stretch;
      }


      .add-button {
        width: 100%;
      }


      .modal-content {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <header>

    <h1>🌷 Ramitos de Pipa</h1>

    <p>
      Panel de administración
    </p>

  </header>


  <main>


    <div class="top-bar">

      <h2>
        🌸 Productos
      </h2>


      <button
        class="add-button"
        id="addProductButton"
      >
        ➕ Agregar producto
      </button>

    </div>


    <div class="categories">


      <button
        class="category-button active"
        data-category="todos"
      >
        Todos
      </button>


      <button
        class="category-button"
        data-category="ramos"
      >
        💐 Ramos
      </button>


      <button
        class="category-button"
        data-category="flores"
      >
        🌸 Flores
      </button>


      <button
        class="category-button"
        data-category="macetas"
      >
        🪴 Macetas
      </button>


      <button
        class="category-button"
        data-category="llaveros"
      >
        🔑 Llaveros
      </button>


      <button
        class="category-button"
        data-category="otro"
      >
        📦 Otros
      </button>


    </div>


    <div
      id="products"
      class="products"
    >

      <div class="empty">

        <h3>
          🌷 Cargando productos...
        </h3>

      </div>

    </div>


  </main>



  <!-- =========================
       MODAL AGREGAR / EDITAR
  ========================= -->


  <div
    id="productModal"
    class="modal"
  >


    <div class="modal-content">


      <h2 id="modalTitle">
        🌷 Agregar producto
      </h2>


      <div class="form-group">

        <label>
          🌷 Nombre del producto
        </label>

        <input
          type="text"
          id="productName"
          placeholder="Ejemplo: Ramo de flores"
        >

      </div>


      <div class="form-group">

        <label>
          📂 Categoría
        </label>

        <select id="productCategory">

          <option value="ramos">
            💐 Ramos
          </option>

          <option value="flores">
            🌸 Flores
          </option>

          <option value="macetas">
            🪴 Macetas
          </option>

          <option value="llaveros">
            🔑 Llaveros
          </option>

          <option value="otro">
            📦 Otros
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          💰 Precio
        </label>

        <input
          type="number"
          id="productPrice"
          placeholder="Ejemplo: 5000"
          min="0"
        >

      </div>


      <div class="form-group">

        <label>
          📝 Descripción
        </label>

        <textarea
          id="productDescription"
          placeholder="Describe el producto..."
        ></textarea>

      </div>


      <div class="form-group">

        <label>
          📷 Imagen
        </label>

        <p style="font-size: 13px; color: #777;">
          Por ahora guardaremos el producto
          sin fotografía. La conexión con
          Cloudinary la hacemos después.
        </p>

      </div>


      <div class="form-group">

        <label>
          📦 Disponibilidad
        </label>

        <select id="productAvailable">

          <option value="true">
            ✅ Disponible
          </option>

          <option value="false">
            ❌ No disponible
          </option>

        </select>

      </div>


      <div class="modal-buttons">


        <button
          class="cancel-button"
          id="cancelButton"
        >
          Cancelar
        </button>


        <button
          class="save-button"
          id="saveProductButton"
        >
          💾 Guardar producto
        </button>


      </div>


    </div>

  </div>



  <script type="module">


    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      doc
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";



    /* =========================
       FIREBASE
    ========================= */


    const firebaseConfig = {

      apiKey:
        "AIzaSyA0redvM8Zg_UwUmhxvgt2zMpWFXwxMNK4",

      authDomain:
        "ramitos-de-pipa.firebaseapp.com",

      projectId:
        "ramitos-de-pipa",

      storageBucket:
        "ramitos-de-pipa.firebasestorage.app",

      messagingSenderId:
        "628847901109",

      appId:
        "1:628847901109:web:4fb8b309b0eac146fc41fc",

      measurementId:
        "G-40G6869742"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getFirestore(app);



    /* =========================
       ELEMENTOS
    ========================= */


    const productsContainer =
      document.getElementById(
        "products"
      );


    const addProductButton =
      document.getElementById(
        "addProductButton"
      );


    const productModal =
      document.getElementById(
        "productModal"
      );


    const modalTitle =
      document.getElementById(
        "modalTitle"
      );


    const productName =
      document.getElementById(
        "productName"
      );


    const productCategory =
      document.getElementById(
        "productCategory"
      );


    const productPrice =
      document.getElementById(
        "productPrice"
      );


    const productDescription =
      document.getElementById(
        "productDescription"
      );


    const productAvailable =
      document.getElementById(
        "productAvailable"
      );


    const cancelButton =
      document.getElementById(
        "cancelButton"
      );


    const saveProductButton =
      document.getElementById(
        "saveProductButton"
      );


    let productos = [];


    let productoEditando = null;



    /* =========================
       CARGAR PRODUCTOS
    ========================= */


    async function cargarProductos() {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "productos"
            )
          );


        productos = [];


        snapshot.forEach(
          function(docSnapshot) {

            productos.push({

              id:
                docSnapshot.id,

              ...docSnapshot.data()

            });

          }
        );


        mostrarProductos(
          "todos"
        );


      } catch (error) {

        console.error(
          "Error al cargar productos:",
          error
        );


        productsContainer.innerHTML = `

          <div class="empty">

            <h3>
              😭 Error al cargar
              los productos
            </h3>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }



    /* =========================
       MOSTRAR PRODUCTOS
    ========================= */


    function mostrarProductos(
      categoria
    ) {


      productsContainer.innerHTML =
        "";


      let lista =
        productos;


      if (
        categoria !== "todos"
      ) {

        lista =
          productos.filter(
            function(producto) {

              return (
                producto.categoria ===
                categoria
              );

            }
          );

      }


      if (
        lista.length === 0
      ) {

        productsContainer.innerHTML = `

          <div class="empty">

            <h3>
              🌷 No hay productos
            </h3>

            <p>
              Puedes agregar uno
              con el botón de arriba.
            </p>

          </div>

        `;

        return;

      }


      lista.forEach(
        function(producto) {


          const tarjeta =
            document.createElement(
              "div"
            );


          tarjeta.className =
            "product-card";


          tarjeta.innerHTML = `

            <div class="product-image">

              ${
                producto.imagenUrl
                  ? `
                    <img
                      src="${producto.imagenUrl}"
                      alt="${
                        producto.nombre ||
                        "Producto"
                      }"
                    >
                  `
                  : "🌷"
              }

            </div>


            <h3>
              ${
                producto.nombre ||
                "Sin nombre"
              }
            </h3>


            <p>
              ${
                producto.descripcion ||
                "Sin descripción"
              }
            </p>


            <p>
              💰 ₡${
                producto.precio || 0
              }
            </p>


            <span
              class="status ${
                producto.disponible
                  ? "available"
                  : "unavailable"
              }"
            >

              ${
                producto.disponible
                  ? "Disponible"
                  : "No disponible"
              }

            </span>


            <div class="actions">


              <button
                class="edit"
                data-id="${producto.id}"
              >
                ✏️ Editar
              </button>


              <button
                class="hide"
                data-id="${producto.id}"
              >

                ${
                  producto.disponible
                    ? "👁️ Ocultar"
                    : "👁️ Mostrar"
                }

              </button>


              <button
                class="delete"
                data-id="${producto.id}"
              >
                🗑️ Eliminar
              </button>


            </div>

          `;


          productsContainer.appendChild(
            tarjeta
          );

        }
      );


      activarBotones();

    }



    /* =========================
       BOTONES DE PRODUCTOS
    ========================= */


    function activarBotones() {


      document
        .querySelectorAll(".edit")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                editarProducto(
                  boton.dataset.id
                );

              }
            );

          }
        );


      document
        .querySelectorAll(".hide")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                cambiarDisponibilidad(
                  boton.dataset.id
                );

              }
            );

          }
        );


      document
        .querySelectorAll(".delete")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                eliminarProducto(
                  boton.dataset.id
                );

              }
            );

          }
        );

    }



    /* =========================
       AGREGAR PRODUCTO
    ========================= */


    addProductButton.addEventListener(
      "click",
      function() {


        productoEditando =
          null;


        modalTitle.textContent =
          "🌷 Agregar producto";


        productName.value =
          "";


        productCategory.value =
          "ramos";


        productPrice.value =
          "";


        productDescription.value =
          "";


        productAvailable.value =
          "true";


        productModal.classList.add(
          "show"
        );

      }
    );



    /* =========================
       CANCELAR
    ========================= */


    cancelButton.addEventListener(
      "click",
      function() {

        productModal.classList.remove(
          "show"
        );

      }
    );



    /* =========================
       EDITAR PRODUCTO
    ========================= */


    function editarProducto(
      id
    ) {


      const producto =
        productos.find(
          function(item) {

            return item.id === id;

          }
        );


      if (!producto) return;


      productoEditando =
        id;


      modalTitle.textContent =
        "✏️ Editar producto";


      productName.value =
        producto.nombre || "";


      productCategory.value =
        producto.categoria || "ramos";


      productPrice.value =
        producto.precio || "";


      productDescription.value =
        producto.descripcion || "";


      productAvailable.value =
        String(
          producto.disponible !== false
        );


      productModal.classList.add(
        "show"
      );

    }



    /* =========================
       GUARDAR PRODUCTO
    ========================= */


    saveProductButton.addEventListener(
      "click",
      async function() {


        const nombre =
          productName.value.trim();


        const categoria =
          productCategory.value;


        const precio =
          Number(
            productPrice.value
          );


        const descripcion =
          productDescription.value.trim();


        const disponible =
          productAvailable.value ===
          "true";


        if (!nombre) {

          alert(
            "🌷 Escribe el nombre del producto."
          );

          return;

        }


        if (
          !productPrice.value
        ) {

          alert(
            "💰 Escribe el precio."
          );

          return;

        }


        saveProductButton.disabled =
          true;


        saveProductButton.textContent =
          "⏳ Guardando...";


        try {


          if (
            productoEditando
          ) {


            await updateDoc(
              doc(
                db,
                "productos",
                productoEditando
              ),
              {

                nombre:
                  nombre,

                categoria:
                  categoria,

                precio:
                  precio,

                descripcion:
                  descripcion,

                disponible:
                  disponible

              }
            );


            alert(
              "✅ Producto actualizado correctamente."
            );


          } else {


            await addDoc(
              collection(
                db,
                "productos"
              ),
              {

                nombre:
                  nombre,

                categoria:
                  categoria,

                precio:
                  precio,

                descripcion:
                  descripcion,

                disponible:
                  disponible,

                imagenUrl:
                  ""

              }
            );


            alert(
              "🌷 ¡Producto agregado correctamente!"
            );

          }


          productModal.classList.remove(
            "show"
          );


          productoEditando =
            null;


          await cargarProductos();


        } catch (error) {


          console.error(
            "Error al guardar:",
            error
          );


          alert(
            "😭 No pudimos guardar el producto.\n\n" +
            error.message
          );


        } finally {


          saveProductButton.disabled =
            false;


          saveProductButton.textContent =
            "💾 Guardar producto";

        }

      }
    );



    /* =========================
       OCULTAR / MOSTRAR
    ========================= */


    async function cambiarDisponibilidad(
      id
    ) {


      const producto =
        productos.find(
          function(item) {

            return item.id === id;

          }
        );


      if (!producto) return;


      try {


        await updateDoc(
          doc(
            db,
            "productos",
            id
          ),
          {

            disponible:
              !producto.disponible

          }
        );


        await cargarProductos();


      } catch (error) {


        console.error(
          error
        );


        alert(
          "😭 No pudimos cambiar la disponibilidad."
        );

      }

    }



    /* =========================
       ELIMINAR
    ========================= */


    async function eliminarProducto(
      id
    ) {


      const producto =
        productos.find(
          function(item) {

            return item.id === id;

          }
        );


      if (!producto) return;


      const confirmar =
        confirm(
          "🗑️ ¿Seguro que quieres eliminar \"" +
          producto.nombre +
          "\"?"
        );


      if (!confirmar) return;


      try {


        await deleteDoc(
          doc(
            db,
            "productos",
            id
          )
        );


        alert(
          "🗑️ Producto eliminado."
        );


        await cargarProductos();


      } catch (error) {


        console.error(
          error
        );


        alert(
          "😭 No pudimos eliminar el producto."
        );

      }

    }



    /* =========================
       CATEGORÍAS
    ========================= */


    document
      .querySelectorAll(
        ".category-button"
      )
      .forEach(
        function(boton) {


          boton.addEventListener(
            "click",
            function() {


              document
                .querySelectorAll(
                  ".category-button"
                )
                .forEach(
                  function(btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


              boton.classList.add(
                "active"
              );


              mostrarProductos(
                boton.dataset.category
              );

            }
          );

        }
      );



    /* =========================
       INICIAR
    ========================= */


    cargarProductos();


  </script>


</body>

</html>
