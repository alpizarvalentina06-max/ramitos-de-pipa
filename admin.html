<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administración — Ramitos de Pipa</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #241e21;
      color: #f9d9e8;
    }

    header {
      background: #633147;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #f5dbe7;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      margin: 0;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-button {
      background: #db8bb4;
      color: white;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .category-button {
      background: #171416;
      border: 1px solid #9b6c82;
      color: #f4cadb;
    }

    .category-button.active {
      background: #db8bb4;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #111111;
      border-radius: 18px;
      padding: 15px;
      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 220px;
      background: #352b31;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      font-size: 55px;
    }

    .product-card h3 {
      margin: 5px 0;
      color: #ffd6e7;
    }

    .product-card p {
      margin: 8px 0;
      color: #f1dce5;
    }

    .status {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 13px;
      margin: 8px 0;
    }

    .available {
      background: #17351f;
      color: #7ee69a;
    }

    .unavailable {
      background: #3a2024;
      color: #f39aa6;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .edit {
      background: #513762;
      color: white;
    }

    .hide {
      background: #292929;
      color: white;
    }

    .delete {
      background: #70383d;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: #111111;
      border-radius: 18px;
      grid-column: 1 / -1;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 15px;

      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow-y: auto;

      background: #111111;

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-content h2 {
      margin-top: 0;
      color: #ffd7e8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ffd4e5;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {

      width: 100%;

      padding: 13px;

      border-radius: 10px;

      border: 1px solid #987083;

      background: #3a3839;

      color: white;

      font-size: 15px;

      outline: none;
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #db8bb4;
    }

    .image-help {
      font-size: 13px;
      color: #cbb5bf;
      margin-top: 8px;
    }

    .image-preview {
      margin-top: 12px;
      display: none;
    }

    .image-preview img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .cancel-button {
      flex: 1;
      background: #292929;
      color: white;
    }

    .save-button {
      flex: 1;
      background: #db8bb4;
      color: white;
    }

    .save-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }

      .top-bar {
        align-items: stretch;
      }

      .add-button {
        width: 100%;
      }

      .modal-content {
        padding: 20px;
      }

      .modal-actions {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


  <header>

    <h1>🌷 Ramitos de Pipa</h1>

    <p>
      Panel de administración
    </p>

  </header>


  <main>


    <div class="top-bar">

      <h2>
        🌸 Productos
      </h2>

      <button
        class="add-button"
        id="addProductButton"
      >
        ➕ Agregar producto
      </button>

    </div>


    <!-- CATEGORÍAS -->

    <div class="categories">

      <button
        class="category-button active"
        data-category="todos"
      >
        Todos
      </button>

      <button
        class="category-button"
        data-category="ramos"
      >
        💐 Ramos
      </button>

      <button
        class="category-button"
        data-category="flores"
      >
        🌸 Flores
      </button>

      <button
        class="category-button"
        data-category="macetas"
      >
        🪴 Macetas
      </button>

      <button
        class="category-button"
        data-category="llaveros"
      >
        🔑 Llaveros
      </button>

      <button
        class="category-button"
        data-category="otro"
      >
        📦 Otros
      </button>

    </div>


    <!-- PRODUCTOS -->

    <div
      id="products"
      class="products"
    >

      <div class="empty">

        <h3>
          🌷 Cargando productos...
        </h3>

      </div>

    </div>


  </main>


  <!-- =========================
       MODAL PRODUCTO
  ========================= -->

  <div
    class="modal"
    id="productModal"
  >

    <div class="modal-content">


      <h2 id="modalTitle">
        🌷 Agregar producto
      </h2>


      <!-- NOMBRE -->

      <div class="form-group">

        <label>
          🌷 Nombre del producto
        </label>

        <input
          type="text"
          id="productName"
          placeholder="Ejemplo: Ramo de flores"
        >

      </div>


      <!-- CATEGORÍA -->

      <div class="form-group">

        <label>
          📂 Categoría
        </label>

        <select id="productCategory">

          <option value="ramos">
            💐 Ramos
          </option>

          <option value="flores">
            🌸 Flores
          </option>

          <option value="macetas">
            🪴 Macetas
          </option>

          <option value="llaveros">
            🔑 Llaveros
          </option>

          <option value="otro">
            📦 Otros
          </option>

        </select>

      </div>


      <!-- PRECIO -->

      <div class="form-group">

        <label>
          💰 Precio
        </label>

        <input
          type="number"
          id="productPrice"
          placeholder="Ejemplo: 5000"
          min="0"
        >

      </div>


      <!-- DESCRIPCIÓN -->

      <div class="form-group">

        <label>
          📝 Descripción
        </label>

        <textarea
          id="productDescription"
          placeholder="Describe el producto..."
        ></textarea>

      </div>


      <!-- IMAGEN -->

      <div class="form-group">

        <label>
          📷 Imagen del producto
        </label>

        <input
          type="file"
          id="productImage"
          accept="image/*"
        >

        <div class="image-help">
          Selecciona una fotografía desde tu
          celular o computadora.
        </div>


        <div
          class="image-preview"
          id="imagePreview"
        >

          <img
            id="previewImage"
            alt="Vista previa"
          >

        </div>

      </div>


      <!-- DISPONIBILIDAD -->

      <div class="form-group">

        <label>
          📦 Disponibilidad
        </label>

        <select id="productAvailable">

          <option value="true">
            ✅ Disponible
          </option>

          <option value="false">
            ❌ No disponible
          </option>

        </select>

      </div>


      <!-- BOTONES -->

      <div class="modal-actions">

        <button
          class="cancel-button"
          id="cancelButton"
        >
          Cancelar
        </button>

        <button
          class="save-button"
          id="saveProductButton"
        >
          💾 Guardar producto
        </button>

      </div>


    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script type="module">


    /* =========================
       FIREBASE
    ========================= */


    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyA0redmV8Zg_UwUmhxvgt2zMpWFXwxMNK4",

      authDomain:
        "ramitos-de-pipa.firebaseapp.com",

      projectId:
        "ramitos-de-pipa",

      storageBucket:
        "ramitos-de-pipa.firebasestorage.app",

      messagingSenderId:
        "628847901109",

      appId:
        "1:628847901109:web:4fb8b309b0eac146fc41fc",

      measurementId:
        "G-40G6869742"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getFirestore(app);



    /* =========================
       CLOUDINARY
    ========================= */


    const CLOUDINARY_CLOUD_NAME =
      "escxwgi4";


    const CLOUDINARY_UPLOAD_PRESET =
      "ramitos_productos";


    const CLOUDINARY_UPLOAD_URL =
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;



    /* =========================
       ELEMENTOS
    ========================= */


    const productsContainer =
      document.getElementById(
        "products"
      );


    const addProductButton =
      document.getElementById(
        "addProductButton"
      );


    const productModal =
      document.getElementById(
        "productModal"
      );


    const modalTitle =
      document.getElementById(
        "modalTitle"
      );


    const productName =
      document.getElementById(
        "productName"
      );


    const productCategory =
      document.getElementById(
        "productCategory"
      );


    const productPrice =
      document.getElementById(
        "productPrice"
      );


    const productDescription =
      document.getElementById(
        "productDescription"
      );


    const productImage =
      document.getElementById(
        "productImage"
      );


    const productAvailable =
      document.getElementById(
        "productAvailable"
      );


    const imagePreview =
      document.getElementById(
        "imagePreview"
      );


    const previewImage =
      document.getElementById(
        "previewImage"
      );


    const cancelButton =
      document.getElementById(
        "cancelButton"
      );


    const saveProductButton =
      document.getElementById(
        "saveProductButton"
      );



    /* =========================
       VARIABLES
    ========================= */


    let productos = [];

    let productoEditando = null;

    let imagenActual = "";



    /* =========================
       ESCAPAR TEXTO
    ========================= */


    function escaparTexto(texto) {

      return String(texto || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }



    /* =========================
       CARGAR PRODUCTOS
    ========================= */


    async function cargarProductos() {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "productos"
            )
          );


        productos = [];


        snapshot.forEach(
          function(docSnapshot) {

            productos.push({

              id:
                docSnapshot.id,

              ...docSnapshot.data()

            });

          }
        );


        mostrarProductos(
          "todos"
        );


      } catch (error) {

        console.error(
          "Error al cargar productos:",
          error
        );


        productsContainer.innerHTML = `

          <div class="empty">

            <h3>
              😭 No pudimos cargar
              los productos
            </h3>

            <p>
              ${escaparTexto(error.message)}
            </p>

          </div>

        `;

      }

    }



    /* =========================
       MOSTRAR PRODUCTOS
    ========================= */


    function mostrarProductos(
      categoria
    ) {

      productsContainer.innerHTML =
        "";


      let lista =
        productos;


      if (
        categoria !== "todos"
      ) {

        lista =
          productos.filter(
            function(producto) {

              return (
                producto.categoria ===
                categoria
              );

            }
          );

      }


      if (
        lista.length === 0
      ) {

        productsContainer.innerHTML = `

          <div class="empty">

            <h3>
              🌷 No hay productos
              aquí todavía
            </h3>

            <p>
              Pulsa "Agregar producto"
              para añadir uno.
            </p>

          </div>

        `;

        return;

      }


      lista.forEach(
        function(producto) {


          const tarjeta =
            document.createElement(
              "div"
            );


          tarjeta.className =
            "product-card";


          let imagenHTML = `

            <div class="placeholder">
              🌷
            </div>

          `;


          if (
            producto.imagenUrl
          ) {

            imagenHTML = `

              <img
                src="${escaparTexto(producto.imagenUrl)}"
                alt="${escaparTexto(producto.nombre)}"
              >

            `;

          }


          tarjeta.innerHTML = `

            <div class="product-image">

              ${imagenHTML}

            </div>


            <h3>
              ${escaparTexto(
                producto.nombre ||
                "Sin nombre"
              )}
            </h3>


            <p>
              ${escaparTexto(
                producto.descripcion ||
                "Sin descripción"
              )}
            </p>


            <p>
              💰 ₡${Number(
                producto.precio || 0
              ).toLocaleString("es-CR")}
            </p>


            <span
              class="status ${
                producto.disponible
                  ? "available"
                  : "unavailable"
              }"
            >

              ${
                producto.disponible
                  ? "Disponible"
                  : "No disponible"
              }

            </span>


            <div class="actions">

              <button
                class="edit"
                data-id="${producto.id}"
              >
                ✏️ Editar
              </button>


              <button
                class="hide"
                data-id="${producto.id}"
              >

                ${
                  producto.disponible
                    ? "👁️ Ocultar"
                    : "👁️ Mostrar"
                }

              </button>


              <button
                class="delete"
                data-id="${producto.id}"
              >
                🗑️ Eliminar
              </button>

            </div>

          `;


          productsContainer.appendChild(
            tarjeta
          );

        }
      );


      activarBotones();

    }



    /* =========================
       ACTIVAR BOTONES
    ========================= */


    function activarBotones() {


      document
        .querySelectorAll(".edit")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                editarProducto(
                  boton.dataset.id
                );

              }
            );

          }
        );


      document
        .querySelectorAll(".hide")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                cambiarDisponibilidad(
                  boton.dataset.id
                );

              }
            );

          }
        );


      document
        .querySelectorAll(".delete")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                eliminarProducto(
                  boton.dataset.id
                );

              }
            );

          }
        );

    }



    /* =========================
       ABRIR MODAL
    ========================= */


    addProductButton.addEventListener(
      "click",
      function() {


        productoEditando =
          null;


        imagenActual =
          "";


        modalTitle.textContent =
          "🌷 Agregar producto";


        productName.value =
          "";


        productCategory.value =
          "ramos";


        productPrice.value =
          "";


        productDescription.value =
          "";


        productAvailable.value =
          "true";


        productImage.value =
          "";


        imagePreview.style.display =
          "none";


        previewImage.src =
          "";


        productModal.classList.add(
          "show"
        );

      }
    );



    /* =========================
       CANCELAR
    ========================= */


    cancelButton.addEventListener(
      "click",
      function() {

        productModal.classList.remove(
          "show"
        );

      }
    );



    /* =========================
       PREVISUALIZAR IMAGEN
    ========================= */


    productImage.addEventListener(
      "change",
      function() {


        const archivo =
          productImage.files[0];


        if (!archivo) {

          imagePreview.style.display =
            "none";

          return;

        }


        if (
          !archivo.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "❌ Selecciona una imagen."
          );

          productImage.value =
            "";

          return;

        }


        const lector =
          new FileReader();


        lector.onload =
          function(evento) {

            previewImage.src =
              evento.target.result;

            imagePreview.style.display =
              "block";

          };


        lector.readAsDataURL(
          archivo
        );

      }
    );



    /* =========================
       SUBIR IMAGEN A CLOUDINARY
    ========================= */


    async function subirImagen(
      archivo
    ) {


      const datos =
        new FormData();


      datos.append(
        "file",
        archivo
      );


      datos.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );


      const respuesta =
        await fetch(
          CLOUDINARY_UPLOAD_URL,
          {
            method: "POST",
            body: datos
          }
        );


      const resultado =
        await respuesta.json();


      if (
        !respuesta.ok
      ) {

        console.error(
          "Cloudinary:",
          resultado
        );


        throw new Error(
          resultado.error?.message ||
          "No se pudo subir la imagen."
        );

      }


      return resultado.secure_url;

    }



    /* =========================
       GUARDAR PRODUCTO
    ========================= */


    saveProductButton.addEventListener(
      "click",
      async function() {


        const nombre =
          productName.value.trim();


        const categoria =
          productCategory.value;


        const precio =
          Number(
            productPrice.value
          );


        const descripcion =
          productDescription.value.trim();


        const disponible =
          productAvailable.value ===
          "true";


        const archivo =
          productImage.files[0];


        if (!nombre) {

          alert(
            "🌷 Escribe el nombre del producto."
          );

          return;

        }


        if (
          !precio &&
          precio !== 0
        ) {

          alert(
            "💰 Escribe el precio."
          );

          return;

        }


        if (!descripcion) {

          alert(
            "📝 Escribe una descripción."
          );

          return;

        }


        try {


          saveProductButton.disabled =
            true;


          saveProductButton.textContent =
            "⏳ Guardando...";


          /* =====================
             SUBIR NUEVA IMAGEN
          ===================== */


          let imagenUrl =
            imagenActual;


          if (archivo) {

            saveProductButton.textContent =
              "☁️ Subiendo imagen...";


            imagenUrl =
              await subirImagen(
                archivo
              );

          }


          /* =====================
             DATOS DEL PRODUCTO
          ===================== */


          const datosProducto = {

            nombre:
              nombre,

            categoria:
              categoria,

            precio:
              precio,

            descripcion:
              descripcion,

            disponible:
              disponible,

            imagenUrl:
              imagenUrl || "",

            actualizado:
              serverTimestamp()

          };



          /* =====================
             EDITAR
          ===================== */


          if (
            productoEditando
          ) {


            await updateDoc(

              doc(
                db,
                "productos",
                productoEditando
              ),

              datosProducto

            );


            alert(
              "✅ ¡Producto actualizado!"
            );


          }


          /* =====================
             NUEVO PRODUCTO
          ===================== */


          else {


            datosProducto.creado =
              serverTimestamp();


            await addDoc(

              collection(
                db,
                "productos"
              ),

              datosProducto

            );


            alert(
              "🌷 ¡Producto agregado correctamente!"
            );

          }


          productModal.classList.remove(
            "show"
          );


          await cargarProductos();


        } catch (error) {


          console.error(
            "Error guardando producto:",
            error
          );


          alert(
            "😭 No pudimos guardar el producto.\n\n" +
            error.message
          );


        } finally {


          saveProductButton.disabled =
            false;


          saveProductButton.textContent =
            "💾 Guardar producto";

        }

      }
    );



    /* =========================
       EDITAR PRODUCTO
    ========================= */


    window.editarProducto =
      function(id) {


        const producto =
          productos.find(
            function(item) {

              return item.id === id;

            }
          );


        if (!producto) {

          alert(
            "❌ No encontramos ese producto."
          );

          return;

        }


        productoEditando =
          id;


        imagenActual =
          producto.imagenUrl ||
          "";


        modalTitle.textContent =
          "✏️ Editar producto";


        productName.value =
          producto.nombre ||
          "";


        productCategory.value =
          producto.categoria ||
          "ramos";


        productPrice.value =
          producto.precio ||
          "";


        productDescription.value =
          producto.descripcion ||
          "";


        productAvailable.value =
          producto.disponible
            ? "true"
            : "false";


        productImage.value =
          "";


        if (
          producto.imagenUrl
        ) {

          previewImage.src =
            producto.imagenUrl;

          imagePreview.style.display =
            "block";

        } else {

          imagePreview.style.display =
            "none";

        }


        productModal.classList.add(
          "show"
        );

      };



    /* =========================
       OCULTAR / MOSTRAR
    ========================= */


    window.cambiarDisponibilidad =
      async function(id) {


        try {


          const producto =
            productos.find(
              function(item) {

                return item.id === id;

              }
            );


          if (!producto) {
            return;
          }


          await updateDoc(

            doc(
              db,
              "productos",
              id
            ),

            {
              disponible:
                !producto.disponible,

              actualizado:
                serverTimestamp()
            }

          );


          await cargarProductos();


        } catch (error) {


          console.error(
            error
          );


          alert(
            "😭 No pudimos cambiar la disponibilidad.\n\n" +
            error.message
          );

        }

      };



    /* =========================
       ELIMINAR
    ========================= */


    window.eliminarProducto =
      async function(id) {


        const producto =
          productos.find(
            function(item) {

              return item.id === id;

            }
          );


        if (!producto) {
          return;
        }


        const confirmar =
          confirm(

            "🗑️ ¿Seguro que quieres eliminar este producto?\n\n" +

            producto.nombre

          );


        if (!confirmar) {
          return;
        }


        try {


          await deleteDoc(

            doc(
              db,
              "productos",
              id
            )

          );


          alert(
            "🗑️ Producto eliminado."
          );


          await cargarProductos();


        } catch (error) {


          console.error(
            error
          );


          alert(
            "😭 No pudimos eliminar el producto.\n\n" +
            error.message
          );

        }

      };



    /* =========================
       FILTROS
    ========================= */


    document
      .querySelectorAll(
        ".category-button"
      )
      .forEach(
        function(boton) {


          boton.addEventListener(
            "click",
            function() {


              document
                .querySelectorAll(
                  ".category-button"
                )
                .forEach(
                  function(btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


              boton.classList.add(
                "active"
              );


              mostrarProductos(
                boton.dataset.category
              );

            }
          );

        }
      );



    /* =========================
       INICIAR
    ========================= */


    cargarProductos();


  </script>


</body>

</html>
