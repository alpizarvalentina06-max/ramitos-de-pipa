<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administración — Ramitos de Pipa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #4a3040;
    }

    header {
      background: #f7c9dc;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      margin: 0;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-button {
      background: #d98caf;
      color: white;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .category-button {
      background: white;
      border: 1px solid #e6b6cc;
      color: #6b4055;
    }

    .category-button.active {
      background: #d98caf;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(100, 50, 80, 0.08);
    }

    .product-image {
      width: 100%;
      height: 180px;
      background: #f5e5ed;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin-bottom: 15px;
    }

    .product-card h3 {
      margin: 5px 0;
    }

    .product-card p {
      margin: 7px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin: 8px 0;
      background: #e5f5e8;
      color: #397345;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .edit {
      background: #ead4f5;
    }

    .hide {
      background: #eee;
    }

    .delete {
      background: #f3c4c4;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 18px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .top-bar {
        align-items: stretch;
      }

      .add-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌷 Ramitos de Pipa</h1>
    <p>Panel de administración</p>
  </header>

  <main>

    <div class="top-bar">
      <h2>🌸 Productos</h2>

      <button
        class="add-button"
        onclick="agregarProducto()"
      >
        ➕ Agregar producto
      </button>
    </div>

    <div class="categories">

      <button
        class="category-button active"
        onclick="mostrarCategoria('todos', this)"
      >
        Todos
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('ramos', this)"
      >
        💐 Ramos
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('flores', this)"
      >
        🌸 Flores
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('macetas', this)"
      >
        🪴 Macetas
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('llaveros', this)"
      >
        🔑 Llaveros
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('otro', this)"
      >
        📦 Otros
      </button>

    </div>

    <div id="products" class="products">

      <div class="empty">
        <h3>🌷 Todavía no hay productos aquí</h3>
        <p>
          Cuando agreguemos productos aparecerán
          automáticamente en este espacio.
        </p>
      </div>

    </div>

  </main>

  <script>

    function agregarProducto() {
      alert(
        "🌷 En el siguiente paso podremos agregar " +
        "un nuevo producto."
      );
    }

    function mostrarCategoria(categoria, boton) {

      const botones =
        document.querySelectorAll(".category-button");

      botones.forEach(function(b) {
        b.classList.remove("active");
      });

      boton.classList.add("active");

      alert(
        "🌷 Categoría seleccionada: " +
        categoria
      );
    }

  </script>

</body>
</html>
