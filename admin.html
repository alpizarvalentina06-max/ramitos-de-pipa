<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administración — Ramitos de Pipa</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #4a3040;
    }


    header {
      background: #f7c9dc;
      padding: 25px 20px;
      text-align: center;
    }


    header h1 {
      margin: 0;
      font-size: 28px;
    }


    header p {
      margin: 8px 0 0;
    }


    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }


    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }


    .top-bar h2 {
      margin: 0;
    }


    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }


    .add-button {
      background: #d98caf;
      color: white;
    }


    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }


    .category-button {
      background: white;
      border: 1px solid #e6b6cc;
      color: #6b4055;
    }


    .category-button.active {
      background: #d98caf;
      color: white;
    }


    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }


    .product-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow:
        0 5px 20px rgba(100, 50, 80, 0.08);
    }


    .product-image {
      width: 100%;
      height: 200px;
      background: #f5e5ed;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
    }


    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .placeholder {
      font-size: 55px;
    }


    .product-card h3 {
      margin: 5px 0;
    }


    .product-card p {
      margin: 7px 0;
    }


    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin: 8px 0;
    }


    .available {
      background: #e5f5e8;
      color: #397345;
    }


    .unavailable {
      background: #eeeeee;
      color: #666666;
    }


    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }


    .edit {
      background: #ead4f5;
    }


    .hide {
      background: #eeeeee;
    }


    .delete {
      background: #f3c4c4;
    }


    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 18px;
      grid-column: 1 / -1;
    }


    /* =========================
       MODAL
    ========================= */


    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }


    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }


    .modal-box {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 20px;
      padding: 25px;
    }


    .modal-box h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }


    .form-group {
      margin-bottom: 16px;
    }


    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }


    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0c2d0;
      border-radius: 10px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }


    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }


    .preview {
      display: none;
      width: 100%;
      height: 180px;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      background: #f5e5ed;
    }


    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }


    .save-button {
      background: #d98caf;
      color: white;
      flex: 1;
    }


    .cancel-button {
      background: #eeeeee;
      flex: 1;
    }


    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }


      .add-button {
        width: 100%;
      }


      .modal {
        padding: 10px;
      }


      .modal-box {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <header>

    <h1>
      🌷 Ramitos de Pipa
    </h1>

    <p>
      Panel de administración
    </p>

  </header>


  <main>


    <div class="top-bar">

      <h2>
        🌸 Productos
      </h2>


      <button
        id="addProductButton"
        class="add-button"
      >
        ➕ Agregar producto
      </button>

    </div>


    <div class="categories">

      <button
        class="category-button active"

      >

      </button>


      <button
        class="category-button"

      </button>


      <button
        class="category-button"

      <button

      <button

      >
        🔑 Llaveros
      </button>


      <button
        class="category-button"

      >
        📦 Otros
      </button>

    </div>


    <div
      id="products"
      class="products"
    >

      <div class="empty">

        <h3>
          🌷 Cargando productos...
        </h3>

      </div>

    </div>

  </main>



  <!-- =========================
       FORMULARIO
  ========================= -->


  <div
    id="productModal"
    class="modal"
  >

    <div class="modal-box">

      <h2 id="modalTitle">
        🌷 Agregar producto
      </h2>


      <div class="form-group">

        <label for="productName">
          Nombre del producto
        </label>

        <input
          type="text"
          id="productName"
          placeholder="Ej. Ramo de rosas"
        >

      </div>


      <div class="form-group">

        <label for="productCategory">
          Categoría
        </label>

        <select id="productCategory">

          <option value="ramos">
            💐 Ramos
          </option>

          <option value="flores">
            🌸 Flores
          </option>

          <option value="macetas">
            🪴 Macetas
          </option>

          <option value="llaveros">
            🔑 Llaveros
          </option>

          <option value="otro">
            📦 Otros
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="productPrice">
          Precio
        </label>

        <input
          type="number"
          id="productPrice"
          min="0"
          placeholder="Ej. 8500"
        >

      </div>


      <div class="form-group">

        <label for="productDescription">
          Descripción
        </label>

        <textarea
          id="productDescription"
          placeholder="Describe el producto..."
        ></textarea>

      </div>


      <div class="form-group">

        <label for="productImage">
          📷 Fotografía
        </label>

        <input
          type="file"
          id="productImage"
          accept="image/*"
        >


        <div
          id="imagePreview"
          class="preview"
        >

          <img
            id="previewImage"
            src=""
            alt="Vista previa"
          >

        </div>

      </div>


      <div class="form-group">

        <label for="productAvailable">
          Disponibilidad
        </label>

        <select id="productAvailable">

          <option value="true">
            ✅ Disponible
          </option>

          <option value="false">
            ❌ No disponible
          </option>

        </select>

      </div>


      <div class="modal-buttons">

        <button
          id="cancelButton"
          class="cancel-button"
        >
          Cancelar
        </button>


        <button
          id="saveProductButton"
          class="save-button"
        >
          💾 Guardar producto
        </button>

      </div>

    </div>

  </div>



  <!-- =========================
       FIREBASE
  ========================= -->


  <script type="module">

      initializeApp
    } from

      getFirestore,

      updateDoc,

      doc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyA0redvM8Zg_UwUmhxvgt2zMpWFXwxMNK4",

      authDomain:
        "ramitos-de-pipa.firebaseapp.com",

      projectId:
        "ramitos-de-pipa",

      storageBucket:
        "ramitos-de-pipa.firebasestorage.app",

      messagingSenderId:

        "1:628847901109:web:4fb8b309b0eac146fc41fc",

      measurementId:
        "G-40G6869742"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getFirestore(app);



    /* =========================
       ELEMENTOS
    ========================= */


    const productsContainer =
      document.getElementById(
        "products"
      );


    const addProductButton =
      document.getElementById(
        "addProductButton"
      );


    const productModal =
      document.getElementById(
        "productModal"
      );


    const modalTitle =
      document.getElementById(
        "modalTitle"
      );


    const productName =
      document.getElementById(
        "productName"
      );


    const productCategory =
      document.getElementById(
        "productCategory"
      );


    const productPrice =
      document.getElementById(
        "productPrice"
      );


    const productDescription =
      document.getElementById(
        "productDescription"
      );


    const productImage =
      document.getElementById(
        "productImage"
      );


    const productAvailable =
      document.getElementById(
        "productAvailable"
      );


    const imagePreview =
      document.getElementById(
        "imagePreview"
      );


    const previewImage =
      document.getElementById(
        "previewImage"
      );


    const cancelButton =
      document.getElementById(
        "cancelButton"
      );


    const saveProductButton =
      document.getElementById(
        "saveProductButton"
      );


    let productos = [];

    let productoEditando = null;

    let imagenActual = "";



    /* =========================
       CARGAR PRODUCTOS
    ========================= */


    async function cargarProductos() {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "productos"
            )
          );


        productos = [];


        snapshot.forEach(
          function(docSnapshot) {

            productos.push({

              id:
                docSnapshot.id,

              ...docSnapshot.data()

            });

          }
        );


        mostrarProductos(
          "todos"
        );


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        productsContainer.innerHTML = `

          <div class="empty">

            <h3>
              😭 No pudimos cargar
              los productos
            </h3>

            <p>
              Revisa la conexión
              con Firebase.
            </p>

          </div>

        `;

      }

    }



    /* =========================
       MOSTRAR PRODUCTOS
    ========================= */


    function mostrarProductos(
      categoria
    ) {

      productsContainer.innerHTML =
        "";


      let lista =
        productos;


      if (
        categoria !== "todos"
      ) {

        lista =
          productos.filter(
            function(producto) {

              return (
                producto.categoria ===
                categoria
              );

            }
          );

      }


      if (lista.length === 0) {

        productsContainer.innerHTML = `

          <div class="empty">

            <h3>
              🌷 No hay productos
            </h3>

            <p>
              Puedes agregar uno
              con el botón de arriba.
            </p>

          </div>

        `;

        return;

      }


      lista.forEach(
        function(producto) {

          const tarjeta =
            document.createElement(
              "div"
            );


          tarjeta.className =
            "product-card";


          let imagen = `

            <div class="placeholder">
              🌷
            </div>

          `;


          if (
            producto.imagenUrl
          ) {

            imagen = `

              <img
                src="${producto.imagenUrl}"
                alt="${
                  producto.nombre ||
                  "Producto"
                }"
              >

            `;

          }


          tarjeta.innerHTML = `

            <div class="product-image">

              ${imagen}

            </div>


            <h3>
              ${
                producto.nombre ||
                "Sin nombre"
              }
            </h3>


            <p>
              ${
                producto.descripcion ||
                "Sin descripción"
              }
            </p>


            <p>
              💰 ₡${
                producto.precio || 0
              }
            </p>


            <span
              class="status ${
                producto.disponible
                  ? "available"
                  : "unavailable"
              }"
            >

              ${
                producto.disponible
                  ? "Disponible"
                  : "No disponible"
              }

            </span>


            <div class="actions">

              <button
                class="edit"
                data-id="${producto.id}"
              >
                ✏️ Editar
              </button>


              <button
                class="hide"
                data-id="${producto.id}"
              >
                ${
                  producto.disponible
                    ? "👁️ Ocultar"
                    : "👁️ Mostrar"
                }
              </button>


              <button
                class="delete"
                data-id="${producto.id}"
              >
                🗑️ Eliminar
              </button>

            </div>

          `;


          productsContainer.appendChild(
            tarjeta
          );

        }
      );


      activarBotones();

    }



    /* =========================
       BOTONES PRODUCTOS
    ========================= */


    function activarBotones() {


      document
        .querySelectorAll(".edit")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                editarProducto(
                  boton.dataset.id
                );

              }
            );

          }
        );


      document
        .querySelectorAll(".hide")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                cambiarDisponibilidad(
                  boton.dataset.id
                );

              }
            );

          }
        );


      document
        .querySelectorAll(".delete")
        .forEach(
          function(boton) {

            boton.addEventListener(
              "click",
              function() {

                eliminarProducto(
                  boton.dataset.id
                );

              }
            );

          }
        );

    }



    /* =========================
       ABRIR AGREGAR
    ========================= */


    addProductButton.addEventListener(
      "click",
      function() {

        productoEditando = null;

        imagenActual = "";


        modalTitle.textContent =
          "🌷 Agregar producto";


        productName.value = "";

        productCategory.value =
          "ramos";

        productPrice.value = "";

        productDescription.value =
          "";

        productAvailable.value =
          "true";

        productImage.value = "";


        imagePreview.style.display =
          "none";


        productModal.classList.add(
          "show"
        );

      }
    );



    /* =========================
       CANCELAR
    ========================= */


    cancelButton.addEventListener(
      "click",
      function() {

        productModal.classList.remove(
          "show"
        );

      }
    );



    /* =========================
       PREVISUALIZAR IMAGEN
    ========================= */


    productImage.addEventListener(
      "change",
      function() {

        const archivo =
          productImage.files[0];


        if (!archivo) {

          imagePreview.style.display =
            "none";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            previewImage.src =
              event.target.result;


            imagePreview.style.display =
              "block";

          };


        reader.readAsDataURL(
          archivo
        );

      }
    );



    /* =========================
       SUBIR A CLOUDINARY
    ========================= */


    async function subirImagen(
      archivo
    ) {

      const formData =
        new FormData();


      formData.append(
        "file",
        archivo
      );


      formData.append(
        "upload_preset",
        "ramitos_productos"
      );


      const respuesta =
        await fetch(
          "https://api.cloudinary.com/v1_1/escxwgi4/image/upload",
          {
            method: "POST",
            body: formData
          }
        );


      if (!respuesta.ok) {

        throw new Error(
          "Cloudinary no pudo subir la imagen."
        );

      }


      const datos =
        await respuesta.json();


      return datos.secure_url;

    }



    /* =========================
       GUARDAR PRODUCTO
    ========================= */


    saveProductButton.addEventListener(
      "click",
      async function() {

        try {

          const nombre =
            productName.value.trim();


          const categoria =
            productCategory.value;


          const precio =
            Number(
              productPrice.value
            );


          const descripcion =
            productDescription.value.trim();


          const disponible =
            productAvailable.value ===
            "true";


          if (!nombre) {

            alert(
              "🌷 Escribe el nombre."
            );

            return;

          }


          if (
            !precio ||
            precio < 0
          ) {

            alert(
              "💰 Escribe un precio válido."
            );

            return;

          }


          if (!descripcion) {

            alert(
              "📝 Escribe una descripción."
            );

            return;

          }

      margin-bottom: 15px;
    }

    .product-card h3 {
      margin: 5px 0;
    }

    .product-card p {
      margin: 7px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin: 8px 0;

      background: #e5f5e8;
      color: #397345;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .edit {
      background: #ead4f5;
    }

    .hide {
      background: #eee;
    }

    .delete {
      background: #f3c4c4;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 18px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }

      .top-bar {
        align-items: stretch;
      }

      .add-button {
        width: 100%;
      }

    }

  </style>

          productos.filter(
            function(producto) {

              return (
                producto.categoria ===
                categoria
              );

            }
          );

      }


      if (lista.length === 0) {

        productsContainer.innerHTML = `

          <div class="empty">

            <h3>
              🌷 No hay productos
            </h3>

            <p>
              Puedes agregar uno
              desde el botón
              "Agregar producto".
            </p>

          </div>

        `;

        return;

      }


      lista.forEach(
        function(producto) {

          const tarjeta =
            document.createElement(
              "div"
            );


          tarjeta.className =
            "product-card";


          tarjeta.innerHTML = `

            <div class="product-image">
              🌷
            </div>

            <h3>
              ${
                producto.nombre ||
                "Sin nombre"
              }
            </h3>

            <p>
              ${
                producto.descripcion ||
                "Sin descripción"
              }
            </p>

            <p>
              💰 ₡${
                producto.precio || 0
              }
            </p>

            <span class="status">

              ${
                producto.disponible
                  ? "Disponible"
                  : "No disponible"
              }

            </span>

            <div class="actions">

              <button class="edit">
                ✏️ Editar
              </button>

              <button class="hide">
                👁️ Ocultar
              </button>

              <button class="delete">
                🗑️ Eliminar
              </button>

            </div>

          `;


          productsContainer
            .appendChild(
              tarjeta
            );

        }
      );

    }


    document
      .querySelectorAll(
        ".category-button"
      )
      .forEach(
        function(boton) {

          boton.addEventListener(
            "click",
            function() {

              document
                .querySelectorAll(
                  ".category-button"
                )
                .forEach(
                  function(btn) {

                    btn.classList
                      .remove(
                        "active"
                      );

                  }
                );


              boton.classList.add(
                "active"
              );


              mostrarProductos(
                boton.dataset.category
              );

            }
          );

        }
      );


    addProductButton.addEventListener(
  "click",
  function() {

    productoEditando = null;

    imagenActual = "";

    modalTitle.textContent =
      "🌷 Agregar producto";

    productName.value = "";

    productCategory.value = "ramos";

    productPrice.value = "";

    productDescription.value = "";

    productAvailable.value = "true";

    productImage.value = "";

    imagePreview.style.display =
      "none";

    productModal.classList.add(
      "active"
    );

  }
);


    cargarProductos();

  </script>


</body>

</html>
