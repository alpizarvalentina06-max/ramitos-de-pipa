<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administración — Ramitos de Pipa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #4a3040;
    }

    header {
      background: #f7c9dc;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      margin: 0;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-button {
      background: #d98caf;
      color: white;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .category-button {
      background: white;
      border: 1px solid #e6b6cc;
      color: #6b4055;
    }

    .category-button.active {
      background: #d98caf;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(100, 50, 80, 0.08);
    }

    .product-image {
      width: 100%;
      height: 180px;
      background: #f5e5ed;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin-bottom: 15px;
    }

    .product-card h3 {
      margin: 5px 0;
    }

    .product-card p {
      margin: 7px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin: 8px 0;
      background: #e5f5e8;
      color: #397345;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .edit {
      background: #ead4f5;
    }

    .hide {
      background: #eee;
    }

    .delete {
      background: #f3c4c4;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 18px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .top-bar {
        align-items: stretch;
      }

      .add-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌷 Ramitos de Pipa</h1>
    <p>Panel de administración</p>
  </header>

  <main>

    <div class="top-bar">
      <h2>🌸 Productos</h2>

      <button
        class="add-button"
        onclick="agregarProducto()"
      >
        ➕ Agregar producto
      </button>
    </div>

    <div class="categories">

      <button
        class="category-button active"
        onclick="mostrarCategoria('todos', this)"
      >
        Todos
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('ramos', this)"
      >
        💐 Ramos
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('flores', this)"
      >
        🌸 Flores
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('macetas', this)"
      >
        🪴 Macetas
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('llaveros', this)"
      >
        🔑 Llaveros
      </button>

      <button
        class="category-button"
        onclick="mostrarCategoria('otro', this)"
      >
        📦 Otros
      </button>

    </div>

    <div id="products" class="products">

      <div class="empty">
        <h3>🌷 Todavía no hay productos aquí</h3>
        <p>
          Cuando agreguemos productos aparecerán
          automáticamente en este espacio.
        </p>
      </div>

    </div>

  </main>

  <script>

    <script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyA0redvM8Zg_UwUmhxvgt2zMpWFXwxMNK4",
    authDomain: "ramitos-de-pipa.firebaseapp.com",
    projectId: "ramitos-de-pipa",
    storageBucket: "ramitos-de-pipa.firebasestorage.app",
    messagingSenderId: "628847901109",
    appId: "1:628847901109:web:4fb8b309b0eac146fc41fc",
    measurementId: "G-40G6869742"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const productsContainer =
    document.getElementById("products");


  let productos = [];


  async function cargarProductos() {

    try {

      const snapshot =
        await getDocs(
          collection(db, "productos")
        );


      productos = [];

      snapshot.forEach(function(doc) {

        productos.push({
          id: doc.id,
          ...doc.data()
        });

      });


      mostrarProductos("todos");

    } catch (error) {

      console.error(
        "Error al cargar productos:",
        error
      );

      productsContainer.innerHTML = `
        <div class="empty">
          <h3>😭 No pudimos cargar los productos</h3>
          <p>
            Revisa la conexión con Firebase.
          </p>
        </div>
      `;

    }

  }


  function mostrarProductos(categoria) {

    productsContainer.innerHTML = "";


    let lista = productos;


    if (categoria !== "todos") {

      lista = productos.filter(function(producto) {

        return producto.categoria === categoria;

      });

    }


    if (lista.length === 0) {

      productsContainer.innerHTML = `
        <div class="empty">
          <h3>🌷 No hay productos en esta categoría</h3>
          <p>
            Puedes agregar uno desde el botón
            "Agregar producto".
          </p>
        </div>
      `;

      return;

    }


    lista.forEach(function(producto) {

      const tarjeta =
        document.createElement("div");

      tarjeta.className = "product-card";


      tarjeta.innerHTML = `

        <div class="product-image">
          🌷
        </div>

        <h3>
          ${producto.nombre || "Sin nombre"}
        </h3>

        <p>
          ${producto.descripcion || "Sin descripción"}
        </p>

        <p>
          💰 ₡${producto.precio || 0}
        </p>

        <span class="status">
          ${producto.disponible ? "Disponible" : "No disponible"}
        </span>

        <div class="actions">

          <button class="edit">
            ✏️ Editar
          </button>

          <button class="hide">
            👁️ Ocultar
          </button>

          <button class="delete">
            🗑️ Eliminar
          </button>

        </div>
      `;


      productsContainer.appendChild(tarjeta);

    });

  }


  window.mostrarCategoria =
    function(categoria, boton) {

      const botones =
        document.querySelectorAll(
          ".category-button"
        );

      botones.forEach(function(b) {

        b.classList.remove("active");

      });


      boton.classList.add("active");

      mostrarProductos(categoria);

    };


  window.agregarProducto = function() {

  const nombre = prompt("🌷 Nombre del producto:");
  if (!nombre) return;

  const categoria = prompt(
    "📂 Categoría:\n\n" +
    "Escribe una de estas:\n" +
    "ramos\n" +
    "flores\n" +
    "macetas\n" +
    "llaveros\n" +
    "otro"
  );

  if (!categoria) return;

  const precio = prompt("💰 Precio del producto:");
  if (!precio) return;

  const descripcion = prompt(
    "📝 Descripción del producto:"
  );

  if (!descripcion) return;

  const disponible = confirm(
    "✅ ¿El producto está disponible?"
  );

  alert(
    "🌷 Producto preparado.\n\n" +
    "En el siguiente paso añadiremos " +
    "la fotografía y lo guardaremos " +
    "automáticamente en Firebase."
  );

};

  cargarProductos();

</script>

</body>
</html>
